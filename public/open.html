<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <title>Sonus Notes</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #121826;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
    .logo {
      max-width: 110px;
      height: auto;
      margin-bottom: 20px;
      border-radius: 20px;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 21px;
      font-weight: 700;
      line-height: 1.35;
      color: #ffffff;
    }
    p.sub {
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.55;
      margin: 0 0 24px 0;
    }
    .btn {
      width: 100%;
      cursor: pointer;
      border: none;
      background: linear-gradient(135deg, #9333ea 0%, #7e22ce 100%);
      color: #ffffff;
      padding: 15px 24px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 18px;
      box-shadow: 0 4px 14px rgba(147, 51, 234, 0.35);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:active {
      transform: scale(0.98);
      opacity: 0.92;
    }
    .stores {
      display: flex;
      justify-content: center;
      gap: 16px;
      font-size: 13px;
    }
    .stores a {
      color: #d8b4fe;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://sonusnotes.app/logo.png" alt="Sonus Notes" class="logo" />
    <h2 id="bridge-title">Yeni Aya Başlamaya Hazır Mısın? 🌙</h2>
    <p id="bridge-sub" class="sub">Sonus Notes uygulamasını açmak ve yeni sesli günlüğünü kaydetmek için aşağıdaki butona dokun.</p>
    <button id="open-app-btn" type="button" class="btn">Sonus Notes Uygulamasını Aç</button>
    <div class="stores">
      <a id="apple-store-link" href="https://apps.apple.com/app/id6764329742">&#63743; App Store</a>
      <a id="play-store-link" href="https://play.google.com/store/apps/details?id=com.ugurdemiroz.sonusnotes">&#9654; Google Play</a>
    </div>
  </div>
  <script>
    (function () {
      var APP_STORE_URL = "https://apps.apple.com/app/id6764329742";
      var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.ugurdemiroz.sonusnotes";
      var DEEP_LINK_URL = "sonusnotes://";
      var CONFIRM_ENDPOINT = "https://qorqeunpveaiigizlcan.supabase.co/functions/v1/monthly-report";

      var COPY = {
        tr: {
          title: "Yeni Aya Ba\u015flamaya Haz\u0131r M\u0131s\u0131n? \uD83C\uDF19",
          sub: "Sonus Notes uygulamas\u0131n\u0131 a\u00e7mak ve yeni sesli g\u00fcnl\u00fc\u011f\u00fcn\u00fc kaydetmek i\u00e7in a\u015fa\u011f\u0131daki butona dokun.",
          openBtn: "Sonus Notes Uygulamas\u0131n\u0131 A\u00e7"
        },
        en: {
          title: "Ready to Start a New Month? \uD83C\uDF19",
          sub: "Tap the button below to open Sonus Notes and record your next voice journal.",
          openBtn: "Open Sonus Notes App"
        },
        es: {
          title: "\u00bfListo para comenzar un nuevo mes? \uD83C\uDF19",
          sub: "Toca el bot\u00f3n de abajo para abrir Sonus Notes y grabar tu pr\u00f3ximo diario de voz.",
          openBtn: "Abrir Sonus Notes"
        },
        ru: {
          title: "\u0413\u043e\u0442\u043e\u0432\u044b \u043d\u0430\u0447\u0430\u0442\u044c \u043d\u043e\u0432\u044b\u0439 \u043c\u0435\u0441\u044f\u0446? \uD83C\uDF19",
          sub: "\u041d\u0430\u0436\u043c\u0438\u0442\u0435 \u043d\u0430 \u043a\u043d\u043e\u043f\u043a\u0443 \u043d\u0438\u0436\u0435, \u0447\u0442\u043e\u0431\u044b \u043e\u0442\u043a\u0440\u044b\u0442\u044c Sonus Notes \u0438 \u0437\u0430\u043f\u0438\u0441\u0430\u0442\u044c \u043d\u043e\u0432\u044b\u0439 \u0433\u043e\u043b\u043e\u0441\u043e\u0432\u043e\u0439 \u0434\u043d\u0435\u0432\u043d\u0438\u043a.",
          openBtn: "\u041e\u0442\u043a\u0440\u044b\u0442\u044c \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435 Sonus Notes"
        }
      };

      var params = new URLSearchParams(window.location.search);
      var rawLang = (params.get("lang") || "en").toLowerCase();
      var lang = COPY[rawLang] ? rawLang : "en";
      var clickToken = params.get("t") || "";
      var sig = params.get("sig") || "";

      document.documentElement.lang = lang;
      var t = COPY[lang];
      var titleEl = document.getElementById("bridge-title");
      var subEl = document.getElementById("bridge-sub");
      var openBtn = document.getElementById("open-app-btn");
      if (titleEl) titleEl.textContent = t.title;
      if (subEl) subEl.textContent = t.sub;
      if (openBtn) openBtn.textContent = t.openBtn;

      var confirmed = false;
      function recordHumanClick() {
        if (confirmed || !clickToken || !sig) return;
        confirmed = true;
        var payload = JSON.stringify({
          action: "confirm-click",
          t: clickToken,
          sig: sig,
          lang: lang,
          userInitiated: true
        });
        try {
          fetch(CONFIRM_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: payload,
            keepalive: true
          }).catch(function () {});
        } catch (_e) {}
      }

      function getFallbackStoreUrl() {
        var ua = navigator.userAgent || navigator.vendor || "";
        if (/android/i.test(ua)) return PLAY_STORE_URL;
        if (/iPad|iPhone|iPod|Macintosh/i.test(ua)) return APP_STORE_URL;
        return APP_STORE_URL;
      }

      function openAppWithStoreFallback() {
        var storeUrl = getFallbackStoreUrl();
        var start = Date.now();
        var fallbackTimer = setTimeout(function () {
          if (document.hidden || document.webkitHidden) return;
          if (Date.now() - start < 2600) {
            window.location.href = storeUrl;
          }
        }, 1600);

        var clearTimerOnHide = function () {
          if (document.hidden || document.webkitHidden) {
            clearTimeout(fallbackTimer);
          }
        };
        document.addEventListener("visibilitychange", clearTimerOnHide, { once: true });
        window.addEventListener("pagehide", function () {
          clearTimeout(fallbackTimer);
        }, { once: true });

        window.location.href = DEEP_LINK_URL;
      }

      if (openBtn) {
        openBtn.addEventListener("click", function (ev) {
          if (ev && ev.isTrusted === false) return;
          recordHumanClick();
          openAppWithStoreFallback();
        });
      }

      var appleLink = document.getElementById("apple-store-link");
      if (appleLink) {
        appleLink.addEventListener("click", function (ev) {
          if (ev && ev.isTrusted === false) return;
          recordHumanClick();
        });
      }

      var playLink = document.getElementById("play-store-link");
      if (playLink) {
        playLink.addEventListener("click", function (ev) {
          if (ev && ev.isTrusted === false) return;
          recordHumanClick();
        });
      }
    })();
  </script>
</body>
</html>
