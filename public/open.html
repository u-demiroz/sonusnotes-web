<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sonus Notes</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 0%, #17132b 0%, #09090b 65%);
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #12121a;
      border: 1px solid #27273a;
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(167, 139, 250, 0.14);
      border: 1px solid rgba(167, 139, 250, 0.3);
      color: #c4b5fd;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 23px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #a1a1aa;
      margin-bottom: 24px;
    }
    .btn-primary {
      display: block;
      width: 100%;
      padding: 15px 24px;
      border-radius: 999px;
      background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      margin-bottom: 16px;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .status-note {
      display: none;
      font-size: 13px;
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.28);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 16px;
      line-height: 1.45;
    }
    .divider {
      font-size: 12px;
      color: #71717a;
      margin: 18px 0 12px;
    }
    .store-links {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-secondary {
      flex: 1;
      min-width: 118px;
      padding: 11px 14px;
      border-radius: 12px;
      background: #1a1a26;
      border: 1px solid #2e2e42;
      color: #e4e4e7;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
    }
    .btn-secondary:hover {
      background: #232334;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">SONUS NOTES</div>
    <h1 id="title">Open Sonus Notes</h1>
    <p id="subtitle">Tap below to open your personal voice reflection space in the Sonus Notes app.</p>

    <button id="openAppBtn" type="button" class="btn-primary">
      Open in Sonus Notes App
    </button>

    <div id="statusNote" class="status-note"></div>

    <div id="storeDivider" class="divider">Don't have the latest update installed?</div>
    <div id="storeLinks" class="store-links">
      <a id="iosLink" class="btn-secondary" href="https://apps.apple.com/app/id6764329742" rel="noopener noreferrer">
        App Store (iOS)
      </a>
      <a id="androidLink" class="btn-secondary" href="https://play.google.com/store/apps/details?id=com.ugurdemiroz.sonusnotes" rel="noopener noreferrer">
        Google Play
      </a>
      <a id="rustoreLink" class="btn-secondary" href="https://www.rustore.ru/catalog/app/com.ugurdemiroz.sonusnotes" rel="noopener noreferrer">
        RuStore
      </a>
    </div>
  </main>

  <script>
    (function () {
      var COPY = {
        insights: {
          en: {
            title: "Your Monthly Reflection Awaits",
            subtitle: "Tap below to open your personal voice journal and insights inside the Sonus Notes app.",
            cta: "Open in Sonus Notes App",
            divider: "Don't have the app installed on this device?"
          },
          ru: {
            title: "Ваш ежемесячный отчёт готов",
            subtitle: "Нажмите кнопку ниже, чтобы открыть личный голосовой дневник и аналитику в приложении Sonus Notes.",
            cta: "Открыть в приложении Sonus Notes",
            divider: "Приложение ещё не установлено на этом устройстве?"
          },
          tr: {
            title: "Aylık Yansıma Raporunuz Hazır",
            subtitle: "Kişisel sesli günlüğünüzü ve içgörülerinizi Sonus Notes uygulamasında açmak için aşağıya dokunun.",
            cta: "Sonus Notes Uygulamasında Aç",
            divider: "Uygulama bu cihazda yüklü değil mi?"
          },
          es: {
            title: "Tu reflexión mensual te espera",
            subtitle: "Toca abajo para abrir tu diario de voz personal y tus análisis en la app Sonus Notes.",
            cta: "Abrir en la app Sonus Notes",
            divider: "¿No tienes la aplicación instalada en este dispositivo?"
          }
        },
        archive: {
          en: {
            title: "Your Journals Are Yours Again",
            subtitle: "Tap below to open your voice journal archive, past audio recordings, and AI reflections in Sonus Notes.",
            cta: "Open My Past Journals",
            divider: "Update to v1.8.0 if you haven't yet:"
          },
          ru: {
            title: "Ваши дневники снова с вами",
            subtitle: "Нажмите ниже, чтобы открыть архив ваших голосовых записей и прежних ИИ-разборов в приложении Sonus Notes.",
            cta: "Открыть мои прежние записи",
            divider: "Обновите приложение до версии 1.8.0:"
          },
          tr: {
            title: "Günlükleriniz Yeniden Sizinle",
            subtitle: "Geçmiş ses kayıtlarınızı ve mevcut yapay zeka analizlerinizi Sonus Notes uygulamasında görüntülemek için aşağıya dokunun.",
            cta: "Geçmiş Günlüklerimi Aç",
            divider: "v1.8.0 güncellemesini henüz yüklemediniz mi?"
          },
          es: {
            title: "Tus diarios vuelven a ser tuyos",
            subtitle: "Toca abajo para abrir tu archivo de notas de voz y tus análisis anteriores en la app Sonus Notes.",
            cta: "Abrir mis diarios anteriores",
            divider: "Actualiza a la versión 1.8.0 si aún no lo has hecho:"
          }
        },
        memory: {
          en: {
            title: "Introducing Sonus Memory",
            subtitle: "Tap below to open Sonus Memory in the app and choose whether to connect your past and new reflections.",
            cta: "Explore Sonus Memory",
            divider: "Make sure you have Sonus Notes v1.8.0 installed:"
          },
          ru: {
            title: "Представляем Память Sonus",
            subtitle: "Нажмите ниже, чтобы открыть раздел «Память Sonus» в приложении и настроить бережную связь между вашими записями.",
            cta: "Открыть «Память Sonus»",
            divider: "Убедитесь, что у вас установлена версия 1.8.0:"
          },
          tr: {
            title: "Sonus Hafıza ile Tanışın",
            subtitle: "Sonus Hafıza ekranını uygulamada açmak ve tercihlerinizi yönetmek için aşağıya dokunun.",
            cta: "Sonus Hafıza'yı Keşfet",
            divider: "Sonus Notes v1.8.0 sürümünün yüklü olduğundan emin olun:"
          },
          es: {
            title: "Presentamos Memoria Sonus",
            subtitle: "Toca abajo para abrir Memoria Sonus en la aplicación y configurar cómo conectar tus reflexiones.",
            cta: "Explorar Memoria Sonus",
            divider: "Asegúrate de tener instalada la versión 1.8.0:"
          }
        },
        home: {
          en: {
            title: "Discover the New Sonus Notes",
            subtitle: "Tap below to open Sonus Notes v1.8.0 and start your voice journal.",
            cta: "Open Sonus Notes",
            divider: "Get the latest version on your device:"
          },
          ru: {
            title: "Откройте обновлённый Sonus Notes",
            subtitle: "Нажмите ниже, чтобы открыть Sonus Notes v1.8.0 и записать свою первую мысль голосом.",
            cta: "Открыть Sonus Notes",
            divider: "Скачайте актуальную версию для вашего устройства:"
          },
          tr: {
            title: "Yeni Sonus Notes'u Keşfedin",
            subtitle: "Sonus Notes v1.8.0 sürümünü açmak ve ilk sesli günlüğünüzü oluşturmak için aşağıya dokunun.",
            cta: "Sonus Notes'u Aç",
            divider: "Cihazınız için en güncel sürümü indirin:"
          },
          es: {
            title: "Descubre el nuevo Sonus Notes",
            subtitle: "Toca abajo para abrir Sonus Notes v1.8.0 y comenzar tu diario de voz.",
            cta: "Abrir Sonus Notes",
            divider: "Descarga la versión más reciente en tu dispositivo:"
          }
        },
        unsubscribe: {
          en: {
            title: "Email Preferences",
            subtitle: "Tap below to unsubscribe from Sonus Notes product update and reminder emails. Account security emails will not be affected.",
            cta: "Confirm Unsubscribe",
            doneTitle: "You're Unsubscribed",
            doneMessage: "Your email address has been removed from future Sonus Notes update and reminder campaigns.",
            errorMessage: "We could not verify this unsubscribe link. Please contact support@sonusnotes.app."
          },
          ru: {
            title: "Настройки рассылки",
            subtitle: "Нажмите кнопку ниже, чтобы отписаться от писем об обновлениях и напоминаний Sonus Notes.",
            cta: "Подтвердить отписку",
            doneTitle: "Вы отписались от рассылки",
            doneMessage: "Ваш адрес исключён из будущих информационных рассылок Sonus Notes.",
            errorMessage: "Не удалось проверить ссылку отписки. Напишите нам на support@sonusnotes.app."
          },
          tr: {
            title: "E-posta Tercihleri",
            subtitle: "Sonus Notes yenilik ve hatırlatma e-postalarından çıkmak için aşağıdaki butona dokunun.",
            cta: "Abonelikten Çıkmayı Onayla",
            doneTitle: "E-posta Listesinden Çıkarıldınız",
            doneMessage: "E-posta adresiniz gelecekteki Sonus Notes duyuru ve hatırlatma gönderimlerinden çıkarıldı.",
            errorMessage: "Bu bağlantı doğrulanamadı. Lütfen support@sonusnotes.app adresinden bize ulaşın."
          },
          es: {
            title: "Preferencias de correo",
            subtitle: "Toca abajo para darte de baja de los correos de novedades y recordatorios de Sonus Notes.",
            cta: "Confirmar baja",
            doneTitle: "Suscripción cancelada",
            doneMessage: "Tu dirección de correo ha sido eliminada de los próximos envíos informativos de Sonus Notes.",
            errorMessage: "No pudimos verificar este enlace. Escríbenos a support@sonusnotes.app."
          }
        }
      };

      var DEEP_LINKS = {
        insights: "sonusnotes://insights",
        archive: "sonusnotes://journal",
        memory: "sonusnotes://memory",
        home: "sonusnotes://"
      };

      var params = new URLSearchParams(window.location.search);
      var rawLang = (params.get("lang") || navigator.language || "en").slice(0, 2).toLowerCase();
      var lang = ["en", "ru", "tr", "es"].indexOf(rawLang) >= 0 ? rawLang : "en";
      var token = (params.get("t") || "").trim();
      var sig = (params.get("sig") || "").trim();
      var src = (params.get("src") || "").trim().toLowerCase();
      var mode = (params.get("mode") || "").trim().toLowerCase();
      var rawTarget = (params.get("target") || "").trim().toLowerCase();
      var targetKey = DEEP_LINKS[rawTarget] ? rawTarget : (src === "v180" ? "home" : "insights");
      var deepLinkUrl = DEEP_LINKS[targetKey] || "sonusnotes://insights";

      var endpointUrl = src === "v180"
        ? "https://qorqeunpveaiigizlcan.supabase.co/functions/v1/release-update-email"
        : "https://qorqeunpveaiigizlcan.supabase.co/functions/v1/monthly-report";

      var btn = document.getElementById("openAppBtn");
      var statusNote = document.getElementById("statusNote");
      var storeDivider = document.getElementById("storeDivider");
      var storeLinks = document.getElementById("storeLinks");

      document.documentElement.lang = lang;

      if (mode === "unsubscribe") {
        var uCopy = COPY.unsubscribe[lang] || COPY.unsubscribe.en;
        document.getElementById("title").textContent = uCopy.title;
        document.getElementById("subtitle").textContent = uCopy.subtitle;
        btn.textContent = uCopy.cta;
        storeDivider.style.display = "none";
        storeLinks.style.display = "none";

        btn.addEventListener("click", function (ev) {
          if (!ev || ev.isTrusted !== true) return;
          btn.disabled = true;
          fetch(endpointUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "confirm-unsubscribe",
              t: token,
              sig: sig,
              lang: lang,
              userInitiated: true
            })
          })
            .then(function (res) {
              return res.json().catch(function () { return {}; }).then(function (data) {
                return { ok: res.ok && data && data.success, data: data };
              });
            })
            .then(function (result) {
              statusNote.style.display = "block";
              if (result.ok) {
                document.getElementById("title").textContent = uCopy.doneTitle;
                statusNote.textContent = uCopy.doneMessage;
                btn.style.display = "none";
              } else {
                statusNote.textContent = uCopy.errorMessage;
                btn.disabled = false;
              }
            })
            .catch(function () {
              statusNote.style.display = "block";
              statusNote.textContent = uCopy.errorMessage;
              btn.disabled = false;
            });
        });
        return;
      }

      var copyGroup = COPY[targetKey] || COPY.insights;
      var copy = copyGroup[lang] || copyGroup.en;
      document.getElementById("title").textContent = copy.title;
      document.getElementById("subtitle").textContent = copy.subtitle;
      btn.textContent = copy.cta;
      storeDivider.textContent = copy.divider;

      var clickConfirmed = false;

      function recordHumanClick(isTrustedEvent) {
        if (clickConfirmed || !isTrustedEvent) return;
        if (!/^[0-9a-f]{32,128}$/i.test(token) || !/^[0-9a-f]{64}$/i.test(sig)) return;
        clickConfirmed = true;

        var payload = JSON.stringify({
          action: "confirm-click",
          t: token,
          sig: sig,
          lang: lang,
          target: targetKey,
          userInitiated: true
        });

        try {
          fetch(endpointUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: payload,
            keepalive: true
          }).catch(function () {});
        } catch (_) {}
      }

      // IMPORTANT: Never auto-fire confirm-click on page load.
      // Email security scanners (Mimecast, Defender, Gmail, Yandex, Mail.ru) prefetch GET URLs
      // and execute onload scripts. Recording clicks strictly inside a trusted user click
      // event prevents automated scanner pre-fetches from polluting click metrics.
      btn.addEventListener("click", function (ev) {
        var trusted = Boolean(ev && ev.isTrusted === true);
        recordHumanClick(trusted);
        window.location.href = deepLinkUrl;
      });
    })();
  </script>
</body>
</html>
